name: ToneReplicatorPlugin
options:
  bundleIdPrefix: com.tonereplicator
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)"]
    OTHER_CPLUSPLUSFLAGS: ["$(inherited)", "-std=c++17"]

targets:
  ToneReplicatorPlugin:
    type: application
    platform: macOS
    sources:
      - ToneReplicatorPlugin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonereplicator.app
        PRODUCT_NAME: Tone Replicator
        INFOPLIST_FILE: ToneReplicatorPlugin/Info.plist
        CODE_SIGN_ENTITLEMENTS: ToneReplicatorPlugin/ToneReplicatorPlugin.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - target: ToneReplicatorAU
    entitlements:
      path: ToneReplicatorPlugin/ToneReplicatorPlugin.entitlements

  ToneReplicatorAU:
    type: framework
    platform: macOS
    sources:
      - ToneReplicatorAU
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonereplicator.au
        PRODUCT_NAME: Tone ReplicatorAU
        INFOPLIST_FILE: ToneReplicatorAU/Info.plist
        CODE_SIGN_ENTITLEMENTS: ToneReplicatorAU/ToneReplicatorAU.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)"]
        OTHER_CPLUSPLUSFLAGS: ["$(inherited)", "-std=c++17"]
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
    entitlements:
      path: ToneReplicatorAU/ToneReplicatorAU.entitlements